<style>
/* Layout: risografie-poster. Ongebleekt papier, inkt in Federal Blue, elk niveau een eigen riso-inkt.
   Grote gecondenseerde koppen, kleurvlakken die over elkaar drukken (multiply), papierkorrel erover. Eén vaste look, geen donkere variant. */
:root {
  --paper: #f5f2ea;
  --ink: #232f5f;        /* Federal Blue */
  --ink-soft: #55608a;
  --yellow: #ffe14a;
  --pink: #ff5fa2;
  --teal: #00a5a8;
  --orange: #ff7a3d;
  --green: #3fb06a;
  --blue: #3a8fd8;
  --red: #ef4f4f;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  --font-latin: "Newsreader", Georgia, serif;
  --lv: var(--yellow);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  background: var(--paper); color: var(--ink);
  font: 17px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 72px;
  overflow-x: hidden;
}
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 60; background-image: var(--grain, none); background-size: 180px; mix-blend-mode: multiply; opacity: .55; }
img { max-width: 100%; display: block; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 900; line-height: .9; text-transform: uppercase; margin: 0; text-wrap: balance; letter-spacing: .005em; }
h1 { font-size: clamp(3rem, 15vw, 6rem); }
h2 { font-size: clamp(2rem, 8vw, 3rem); }
h3 { font-size: 1.9rem; }
p { margin: 0; }
i, .latin { font-family: var(--font-latin); font-style: italic; font-weight: 400; text-transform: none; }
a { color: var(--ink); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 44px; }
.small { font-size: .88rem; color: var(--ink-soft); }
.label { font-family: var(--font-display); font-weight: 700; font-size: 1rem; letter-spacing: .08em; text-transform: uppercase; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.ov { mix-blend-mode: multiply; }

/* Kop */
header.top { max-width: 720px; margin: 0 auto; padding-block: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); font-family: var(--font-display); font-weight: 900; font-size: 2rem; text-transform: uppercase; line-height: 1; }
.brand svg { width: 34px; height: 34px; flex: none; }
nav { display: flex; gap: 6px; }
nav a { color: var(--ink); text-decoration: none; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; text-transform: uppercase; letter-spacing: .04em; padding: 2px 8px; }
nav a[aria-current="page"] { background: var(--pink); mix-blend-mode: multiply; }

/* Knoppen */
button { font: 700 1rem var(--font-body); cursor: pointer; color: var(--ink); background: var(--paper); border: 2.5px solid var(--ink); border-radius: 0; padding: 10px 16px; transition: transform .1s, box-shadow .1s; }
/* Keuze foto + geluid / alleen foto's */
.modepick { display: grid; gap: 8px; }
.mp-label { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: .95rem; }
.mp-opts { display: grid; grid-template-columns: 1fr 1fr; border: 2.5px solid var(--ink); background: var(--paper); }
.mp-opts button { border: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px; background: transparent; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 1.15rem; line-height: 1.05; }
.mp-opts button + button { border-left: 2.5px solid var(--ink); }
.mp-opts button svg { width: 30px; height: 30px; }
.mp-opts button[aria-checked="true"] { background: var(--ink); color: var(--paper); }
.mp-opts /* Open vraag */
.openq { display: grid; gap: 10px; }
.openrow { display: flex; gap: 8px; }
.openrow input { flex: 1; min-width: 0; font: 600 1.2rem var(--font-body); color: var(--ink); background: var(--paper); border: 2.5px solid var(--ink); border-radius: 0; padding: 12px 14px; }
.openrow input:focus { outline: 3px solid var(--lv); outline-offset: 2px; }
.openrow input.right { background: #c8ecd2; border-color: #1f7a45; }
.openrow input.wrong { background: #ffd3d8; text-decoration: line-through; }
.openrow .primary { flex: none; }
.dunno { justify-self: start; border: 0; background: none; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.dunno:hover:not(:disabled) { box-shadow: none; transform: none; }
.swipe { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.swipe::-webkit-scrollbar { display: none; }
.swipe img { flex: 0 0 100%; scroll-snap-align: start; }
.dots { display: flex; gap: 10px; justify-content: center; padding-top: 10px; }
.dots button { width: 12px; height: 12px; min-height: 0; padding: 0; border: 2px solid var(--ink); border-radius: 50%; background: transparent; box-shadow: none; }
.dots button.on { background: var(--ink); }
button:hover:not(:disabled) { box-shadow: none; transform: none; }
.mp-opts button[aria-checked="false"]:hover { background: rgba(35, 47, 95, .08); }
/* Wissel in de quiz */
.qsnd { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; font-size: .9rem; flex: none; }
.qsnd svg { width: 18px; height: 18px; }
.qsnd[aria-pressed="false"] { background: var(--ink); color: var(--paper); }
button:hover:not(:disabled) { box-shadow: 4px 4px 0 var(--pink); transform: translate(-2px, -2px); }
button:disabled { cursor: default; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
.primary { background: var(--ink); color: var(--yellow); }
.big { font-family: var(--font-display); font-size: 1.5rem; text-transform: uppercase; letter-spacing: .03em; padding: 10px 22px 8px; }

/* Voorpagina: poster */
.poster { position: relative; background: var(--yellow); padding: 26px 22px 24px; overflow: hidden; display: grid; gap: 18px; isolation: isolate; }
.poster .disc { position: absolute; width: 260px; height: 260px; border-radius: 50%; background: var(--pink); right: -70px; top: -60px; mix-blend-mode: multiply; z-index: -1; }
.poster .disc2 { position: absolute; width: 150px; height: 150px; border-radius: 50%; background: var(--teal); right: 110px; top: 70px; mix-blend-mode: multiply; z-index: -1; opacity: .8; }
.poster .halftone { position: absolute; inset: auto 0 0 0; height: 40%; z-index: -1; background-image: radial-gradient(var(--orange) 32%, transparent 34%); background-size: 11px 11px; mix-blend-mode: multiply; opacity: .55; -webkit-mask-image: linear-gradient(to top, #000, transparent); mask-image: linear-gradient(to top, #000, transparent); }
.poster h1 { color: var(--ink); mix-blend-mode: multiply; max-width: 7.5em; margin-top: clamp(60px, 22vw, 150px); position: relative; z-index: 2; }
.poster .kicker { max-width: 55%; }
.poster .kicker { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: .06em; text-transform: uppercase; }
.poster .lede { font-size: 1.08rem; max-width: 30ch; font-weight: 600; }
.poster .bird { position: absolute; right: 0; top: 14px; width: 46%; max-width: 300px; z-index: 1; pointer-events: none; }
.poster .bird img { width: 100%; }
.counts { display: flex; gap: 22px; flex-wrap: wrap; }
.counts div { display: grid; line-height: 1; }
.counts b { font-family: var(--font-display); font-weight: 900; font-size: 3rem; }
.counts span { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: .9rem; }
.poster .primary { justify-self: start; }
.sod { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px; align-items: center; }
.sod .frame { background: var(--lv); padding: 6px; }
.sod p { font-size: .95rem; }

/* Leerpad: gestapelde kleurbanden */
.route-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 14px; }
.index { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.lvl { position: relative; background: var(--lv); padding: 18px 18px 18px 92px; display: grid; gap: 10px; isolation: isolate; overflow: hidden; }
.lvl .num { position: absolute; left: 10px; top: -6px; font-family: var(--font-display); font-weight: 900; font-size: 7rem; line-height: 1; color: var(--ink); mix-blend-mode: multiply; opacity: .9; }
.lvl .stamp { position: absolute; right: -28px; bottom: -40px; width: 130px; height: 130px; border-radius: 50%; background: var(--pink); mix-blend-mode: multiply; opacity: .5; z-index: -1; }
.lvl h3 { mix-blend-mode: multiply; }
.lvl .meta { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: .95rem; }
.lvl .why { font-size: .95rem; max-width: 52ch; }
.lvl.locked { background: color-mix(in srgb, var(--lv) 38%, var(--paper)); }
.lvl.locked .num { opacity: .35; }
.lvl.locked .stamp { display: none; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.dots i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--ink); }
.dots i.seen { background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); }
.dots i.known { background: var(--ink); }
.lvl.locked .dots i { opacity: .45; }
.lvl button { background: var(--paper); }
@media (max-width: 460px) { .lvl { padding-left: 18px; padding-top: 70px; } .lvl .num { font-size: 5.5rem; top: -10px; } }

/* Quiz */
.panel { display: grid; gap: 18px; }
.qtop { display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.qtop a { text-decoration: none; }
.segs { flex: 1; height: 12px; border: 2.5px solid var(--ink); position: relative; background: var(--paper); }
.segs b { position: absolute; inset: 0 auto 0 0; background: var(--lv); }
.streak { background: var(--pink); padding: 0 6px; mix-blend-mode: multiply; }
.streak:empty { display: none; }
.question { font-family: var(--font-display); font-weight: 900; font-size: clamp(2.6rem, 12vw, 4rem); text-transform: uppercase; line-height: .9; }
.media { background: var(--lv); padding: 10px; aspect-ratio: auto; overflow: visible; position: relative; }
.media img { width: 100%; aspect-ratio: 16 / 15; object-fit: cover; }
.figcap { display: flex; justify-content: space-between; gap: 12px; font-size: .82rem; margin-top: -10px; color: var(--ink-soft); }
.options { display: grid; gap: 10px; }
.options button { width: 100%; text-align: left; padding: 12px 14px; display: flex; gap: 14px; align-items: baseline; font-size: 1.1rem; }
.options button kbd { font-family: var(--font-display); font-weight: 900; font-size: 1.3rem; width: 1em; }
.options button .opt-latin { margin-left: auto; font-size: .9rem; font-weight: 400; display: none; }
.options button:disabled .opt-latin { display: inline; }
.options button.right { background: var(--green); color: var(--ink); }
.options button.wrong { background: var(--pink); text-decoration: line-through; text-decoration-thickness: 2px; }
.options button:disabled:not(.right):not(.wrong) { opacity: .45; }
.feedback { display: grid; gap: 6px; background: color-mix(in srgb, var(--green) 30%, var(--paper)); padding: 14px 16px; }
.feedback.bad { background: color-mix(in srgb, var(--pink) 28%, var(--paper)); }
.feedback strong { font-family: var(--font-display); font-weight: 900; font-size: 1.7rem; text-transform: uppercase; line-height: 1; }
.feedback ul { margin: 0; padding-left: 18px; }
.intro-name { display: grid; gap: 4px; }
.intro-name i { font-size: 1.3rem; }
.credit { font-size: .76rem; color: var(--ink-soft); }
.credit a { color: var(--ink-soft); }

/* Speler met sonogram */
.player { background: var(--lv); display: grid; position: relative; }
.player .sono { width: 100%; height: 120px; display: block; mix-blend-mode: multiply; }
.player.big .sono { height: 180px; }
.pcontrols { display: flex; align-items: center; gap: 14px; padding: 10px 12px; }
.pcontrols .small { font-family: var(--font-display); font-weight: 700; font-size: 1rem; letter-spacing: .05em; color: var(--ink); font-variant-numeric: tabular-nums; }
.playbtn { width: 56px; height: 56px; border-radius: 50%; padding: 0; font-size: 1.1rem; background: var(--ink); color: var(--yellow); flex: none; }
.player.big .playbtn { width: 68px; height: 68px; font-size: 1.3rem; }
.player.playing .playbtn { background: var(--pink); color: var(--ink); }

/* Klaar */
.done { background: var(--lv); padding: 22px; position: relative; overflow: hidden; isolation: isolate; }
.done::before { content: ""; position: absolute; width: 260px; height: 260px; border-radius: 50%; background: var(--pink); right: -70px; top: -70px; mix-blend-mode: multiply; z-index: -1; }
.done .score { font-family: var(--font-display); font-weight: 900; font-size: 8rem; line-height: .85; }
.done .score span { font-size: 4rem; opacity: .6; }
.tally { display: flex; gap: 22px; margin: 0; }
.tally div { display: grid; line-height: 1; }
.tally dt { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: .9rem; order: 2; }
.tally dd { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 2.6rem; }

/* Gids */
.sect-head { display: grid; gap: 2px; border-bottom: 6px solid var(--lv); padding-bottom: 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px 14px; }
.card { text-decoration: none; color: var(--ink); display: grid; gap: 6px; }
.card .thumb { aspect-ratio: 1; background: var(--lv); overflow: hidden; }
.card .thumb img { width: 100%; height: 100%; object-fit: cover; }
.card .name { display: grid; line-height: 1.2; }
.card .name strong { font-family: var(--font-display); font-weight: 900; font-size: 1.35rem; text-transform: uppercase; line-height: 1; }
.card .name i { font-size: .88rem; color: var(--ink-soft); }
.card:hover .thumb { box-shadow: 5px 5px 0 var(--pink); }
.ava.big { width: 100%; height: 100%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: 3rem; text-transform: uppercase; color: var(--ink); mix-blend-mode: multiply; background-image: radial-gradient(color-mix(in srgb, var(--ink) 35%, transparent) 30%, transparent 32%); background-size: 9px 9px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.gallery figure { margin: 0; display: grid; gap: 4px; background: var(--lv); padding: 6px; }
.gallery img { aspect-ratio: 1; object-fit: cover; width: 100%; }
.sounds { display: grid; gap: 14px; }
.notice { background: var(--pink); padding: 12px 14px; }

/* Beloning */
.xpfloat { position: absolute; z-index: 30; font-family: var(--font-display); font-weight: 900; color: var(--ink); background: var(--yellow); padding: 0 6px; font-size: 1.3rem; pointer-events: none; animation: xp 1s ease-out forwards; }
@keyframes xp { to { transform: translateY(-48px) rotate(-6deg); opacity: 0; } }
.toast { position: fixed; z-index: 40; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 420px; background: var(--green); color: var(--ink); border: 2.5px solid var(--ink); padding: 10px 14px; font-weight: 700; display: flex; gap: 10px; align-items: center; animation: tin .3s cubic-bezier(.2,1.4,.4,1); }
.toast .tick { font-family: var(--font-display); font-weight: 900; font-size: 1.4rem; }
.toast.out { opacity: 0; transition: opacity .4s; }
@keyframes tin { from { transform: translateY(24px); opacity: 0; } }
.fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
.levelup { position: fixed; inset: 0; z-index: 45; background: var(--lv); display: grid; align-content: center; padding: max(24px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); overflow: auto; isolation: isolate; animation: wipe .45s cubic-bezier(.7,0,.2,1); }
.levelup.out { opacity: 0; transition: opacity .3s; }
.levelup::before { content: ""; position: absolute; width: 70vmin; height: 70vmin; border-radius: 50%; background: var(--pink); right: -15vmin; top: 8vmin; mix-blend-mode: multiply; z-index: -1; }
.levelup .flock-fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
.lu-card { position: relative; max-width: 560px; margin: 0 auto; width: 100%; display: grid; gap: 14px; }
.lu-num { font-family: var(--font-display); font-weight: 900; font-size: 13rem; line-height: .78; mix-blend-mode: multiply; }
.lu-flock { display: flex; gap: 8px; flex-wrap: wrap; }
.lu-flock img, .lu-flock .ava { width: 56px; height: 56px; object-fit: cover; background: var(--paper); }
.lu-flock .ava { font-size: 1.2rem; }
@keyframes wipe { from { clip-path: circle(0% at 50% 100%); } to { clip-path: circle(150% at 50% 100%); } }
@media (prefers-reduced-motion: no-preference) {
  #app > section { animation: drop .35s cubic-bezier(.2,.9,.3,1); }
  .poster .disc { animation: float 9s ease-in-out infinite alternate; }
  .poster .disc2 { animation: float 7s ease-in-out infinite alternate-reverse; }
  .lu-num { animation: stampin .5s cubic-bezier(.2,1.6,.4,1) .2s both; }
}
@keyframes drop { from { transform: translateY(14px); opacity: 0; } }
@keyframes float { to { transform: translate(-24px, 18px); } }
@keyframes stampin { from { transform: scale(1.6) rotate(-8deg); opacity: 0; } }
</style>

const TIPS = {"vink":["Man met blauwgrijze kop en roze borst, vrouw grijsbruin; beide met twee witte vleugelstrepen.","Zang: vrolijk, aflopend riedeltje met een krul aan het eind; roep 'pink pink'.","Witte vleugelstrepen en witte buitenste staartpennen zie je goed als hij opvliegt."],"winterkoning":["Piepklein, rond en roodbruin, met een staartje dat vaak rechtop staat.","Zang: verrassend hard en snel, met een ratelende triller erin.","Scharrelt laag door struiken en takkenhopen, als een muisje."],"turksetortel":["Slanke, zandkleurige duif met een smal zwart halsbandje.","Roep: drielettergrepig 'koe-KOE-koe', eindeloos herhaald.","Kleiner en lichter dan de houtduif, zonder witte halsvlek."],"kauw":["Kleine, grijszwarte kraai met grijze nek en een lichtgrijs oog.","Roep: kort en hoog 'kjak', vaak in groepjes.","Kleiner en compacter dan zwarte kraai en roek; nestelt in schoorstenen."],"zwartekraai":["Helemaal zwart, met een forse, zwarte snavel met bevederde basis.","Roep: schor 'kraa kraa', meestal drie of vier keer.","Vaak alleen of met z'n tweeën; de roek heeft een kale, grijze snavelbasis."],"heggenmus":["Grijze kop en borst, bruin gestreepte rug, dun spitssnaveltje.","Zang: snel, hoog en kabbelend riedeltje zonder duidelijke opbouw.","Lijkt op een mus, maar heeft een dun insecteneterssnaveltje en scharrelt stil onder struiken."],"groenling":["Olijfgroen met felgele vlekken op vleugel en staart, dikke lichte snavel.","Zang: zoemend 'djuuuuw' en vrolijke trillers; vaak in een baltsvlucht.","Forser dan een sijs en zonder streepjes; komt graag op zonnebloempitten."],"stadsduif":["Variabel van kleur, vaak blauwgrijs met twee zwarte vleugelbanden.","Roep: zacht, rollend koeren 'roe-koe'.","Witte stuit en zwarte vleugelbanden verraden de rotsduif-afkomst; geen witte halsvlek."],"gierzwaluw":["Helemaal donker, met lange sikkelvormige vleugels en korte gevorkte staart.","Roep: schril 'srieee', vaak in gierende groepen rond daken.","Van mei tot begin augustus; landt bijna nooit en is groter dan de zwaluwen."],"zwarteroodstaart":["Man roetzwart met witte vleugelvlek, vrouw donker grijsbruin; beide met roestrode staart.","Zang: kort riedeltje met een krassend, knisperend geluid erin.","Trilt steeds met de rode staart; zingt vanaf daken en antennes."],"staartmees":["Klein, rond bolletje met een extreem lange staart, roze en zwart-wit.","Roep: hoog 'sie sie sie' en een rollend 'tsirrr'.","Trekt in familiegroepjes door bomen; het lichaam is kleiner dan een pimpelmees."],"halsbandparkiet":["Felgroene parkiet met lange staart en rode snavel; man met zwart-rosé halsband.","Roep: schel, krijsend 'kie-kie-kie', vaak in de vlucht.","Exoot die in steden broedt; vliegt snel en recht met puntige vleugels."],"stormmeeuw":["Lijkt op een kleine zilvermeeuw, met groengele snavel zonder rode vlek.","Roep: hoog en schel 'kjieee', hoger dan de zilvermeeuw.","Vriendelijker kopje met donker oog; poten groengeel."],"zilvermeeuw":["Grote meeuw met lichtgrijze rug, roze poten en gele snavel met rode vlek.","Roep: luid lachend 'kjaaw-kjaw-kjaw'.","Kleine mantelmeeuw heeft een donkere rug en gele poten."],"kleinemantelmeeuw":["Grote meeuw met donkergrijze rug en gele poten.","Roep: lager en voller dan de zilvermeeuw.","Grote mantelmeeuw is nog groter, met zwarte rug en roze poten."],"knobbelzwaan":["Grote witte zwaan met oranje snavel en zwarte knobbel.","Meestal stil; de vleugels maken in de vlucht een zingend 'wuu-wuu'.","Zwemt met gebogen nek; wilde en kleine zwaan hebben een gele snavelbasis."],"grauwegans":["Grote grijsbruine gans met oranje snavel en roze poten.","Roep: luid, schetterend 'ga-ga-gak', als een boerenerfgans.","Lichte grijze voorvleugel zichtbaar in de vlucht; de stamvorm van de tamme gans."],"canadesegans":["Grote bruine gans met zwarte hals en kop en een witte kinband.","Roep: trompetterend 'ho-honk'.","Brandgans is kleiner, met wit gezicht en grijze rug."],"nijlgans":["Bruinbeige gans met donkere vlek rond het oog en roze poten.","Roep: hees gesis en schetterend getoeter.","In de vlucht grote witte vleugelvlakken; vaak ruziezoekend."],"kuifeend":["Man zwart met witte flanken en een hangend kuifje, geel oog.","Meestal stil; vrouw roept zacht grommend.","Duikt veel; vrouw is bruin, soms met witte snavelbasis."],"tafeleend":["Man met roodbruine kop, zwarte borst en lichtgrijze rug.","Meestal stil; man fluit zacht in de balts.","Vrouw is grijsbruin met lichte bril; duikt voor plantenvoedsel."],"krakeend":["Man fijn grijs getekend met zwart achterwerk; vrouw lijkt op wilde eend.","Roep: man laag 'ark', vrouw kwaakt.","Witte vlek in de vleugel (spiegel) is het beste kenmerk."],"fuut":["Elegante fuut met lange witte hals en in het voorjaar oranje-zwarte kraag.","Roep: rauw, knorrend 'krrooa'.","Dompelt onder om te vissen; bekend om de baltsdans in het voorjaar."],"dodaars":["Klein, rond fuutje; zomer met kastanjebruine wangen en geel vlekje bij de snavel.","Roep: hinnikende triller 'bibibibi', vaak uit het riet.","Lijkt een badeendje met donzig achterwerk; duikt telkens weg."],"grotezilverreiger":["Grote, helemaal witte reiger met lange hals en lange zwarte poten.","Meestal stil; soms een laag krassend 'kraa'.","Kleine zilverreiger is veel kleiner, met zwarte snavel en gele tenen."],"grotebontespecht":["Zwart-witte specht met grote witte schoudervlekken en rode onderstaart.","Geluid: snel roffelen op hout; roep scherp 'kik'.","Kleine bonte specht is musgroot en mist de witte schoudervlekken."],"boomkruiper":["Bruin gestreept vogeltje met wit buikje en dunne, gebogen snavel.","Zang: hoog, stijgend riedeltje 'tie-tie-tietereroiet'.","Klimt in spiraal tegen stammen omhoog en vliegt dan naar de voet van de volgende boom."],"boomklever":["Blauwgrijze rug, oranjebeige buik en een zwarte oogstreep.","Roep: luid fluitend 'twiet twiet' en snelle trillers.","De enige die ook met de kop naar beneden langs een stam loopt."],"gaai":["Roze-bruin met wit stuitje en felblauwe vleugelvlek.","Roep: schor, krijsend 'kschrèè'; imiteert ook buizerds.","Verstopt in de herfst eikels; schuw in het bos."],"zwartkop":["Grijsbruin met zwart petje (man) of roodbruin petje (vrouw).","Zang: helder fluitend, eindigt vaak in een luide, volle uithaal.","Geen echte mees, maar een grasmus-achtige; zit verstopt in struiken."],"tjiftjaf":["Klein, olijfbruin vogeltje met donkere pootjes en vage wenkbrauw.","Zang: zegt zijn eigen naam, 'tjif tjaf tjif tjaf'.","Fitis lijkt erop maar zingt een aflopend liedje en heeft lichte poten."],"kievit":["Zwart-wit met groen-paarse glans en een lange kuif.","Roep: 'kie-wiet', vaak met tuimelende baltsvlucht.","Brede, ronde vleugels die in de vlucht flappen."],"grutto":["Lange poten en lange rechte snavel; zomer met oranje hals.","Roep: luid 'grutto grutto' of 'tureluu'.","In de vlucht brede witte vleugelstreep en zwarte staartband; nationale vogel."],"tureluur":["Bruingrijze steltloper met felrode poten en rode snavelbasis.","Roep: nerveus 'tjuu-huu-huu' en luid alarm 'tjiep tjiep'.","In de vlucht brede witte achterrand aan de vleugel."],"scholekster":["Zwart-wit met oranjerode snavel en roze poten.","Roep: schel, doordringend 'kliep kliep'.","Witte V-vormige vlek op de rug in de vlucht."],"wulp":["Grote, bruin gespikkelde steltloper met een heel lange, gebogen snavel.","Roep: melancholiek 'kur-lie', in het voorjaar een borrelende triller.","Regenwulp is kleiner, met kortere snavel en een gestreepte kruin."],"buizerd":["Middelgrote roofvogel, vaak bruin met lichte borstband; erg variabel.","Roep: miauwend 'pieeuw', vaak in de lucht.","Zit vaak op paaltjes langs de weg; zweeft met vleugels in een ondiepe V."],"torenvalk":["Roodbruine rug met zwarte stippen; man met blauwgrijze kop en staart.","Roep: hoog, snel 'kie-kie-kie'.","Bidt: hangt stil in de lucht boven bermen."],"boerenzwaluw":["Blauwzwart met roodbruine keel en lange staartspiesen.","Zang: snel gekwetter met een rollend 'rrr' erin.","Broedt in stallen; huiszwaluw heeft een witte stuit en korte staart."],"huiszwaluw":["Blauwzwart met spierwitte buik en witte stuit.","Roep: kort 'prrt', gekwetter rond de nesten.","Bouwt modderkommetjes onder dakranden; korte gevorkte staart."],"veldleeuwerik":["Bruin gestreept, met klein kuifje en witte staartranden.","Zang: eindeloos, jubelend getsjilp hoog in de lucht.","Stijgt zingend op tot een stipje; broedt in weilanden en akkers."],"graspieper":["Klein, olijfbruin gestreept vogeltje met dunne snavel.","Roep: dun 'ist ist'; zang in een parachutevlucht.","Boompieper is forser en zingt vanuit een boom; graspieper heeft lange achternagels."],"wittekwikstaart":["Zwart, wit en grijs met een lange, wippende staart.","Roep: helder 'tsiezik'.","Loopt snel op straten en daken; wipt steeds met de staart."],"gelekwikstaart":["Kanariegele buik, olijfgroene rug en lange staart.","Roep: 'psjiep', vaak overvliegend.","Rond vee in weilanden; grote gele kwikstaart heeft een grijze rug."],"ooievaar":["Grote witte vogel met zwarte vleugels en rode snavel en poten.","Bijna stil; klepperen met de snavel op het nest.","Vliegt met gestrekte hals en zweeft op thermiek."],"fazant":["Haan met koperkleurig verenkleed, groene kop met rood en heel lange staart.","Roep: luid, schor 'kò-kok' gevolgd door vleugelgeroffel.","Hen is bruin gevlekt met kortere staart; vliegt luid klapperend op."],"patrijs":["Rond grijs hoen met oranje gezicht en bruine hoefijzervlek op de buik.","Roep: krassend 'kirr-ik', vooral in de schemering.","Leeft in groepjes (koppels) op akkers; zeldzaam geworden."],"kerkuil":["Witte borst, goudbeige rug en een hartvormig wit gezicht.","Roep: schor, langgerekt gekrijs 'chrrrii'.","Jaagt in de schemering laag over velden; broedt in schuren en kerktorens."],"steenuil":["Klein, gedrongen uiltje met gele ogen en witte vlekken.","Roep: miauwend 'kiew' en klagend 'oe-hu'.","Zit vaak overdag in knotwilgen of op schuren; wipt met het lijf als hij schrikt."],"ringmus":["Bruine kruin, witte wang met zwarte vlek.","Roep: hoog 'tsjip' en 'tet-tet' in de vlucht.","Huismus-man heeft een grijze kruin en geen wangvlek; ringmus man en vrouw zien er gelijk uit."],"kneu":["Man met rode borst en kruin, bruine rug en grijze kop; vrouw bruin gestreept.","Zang: snel, twitterend en melodieus.","Witte randen op vleugel en staart; leeft in groepjes op akkers en in heggen."],"roek":["Zwart met paarse glans en een kale, grijswitte snavelbasis.","Roep: schor 'kaah', in drukke kolonies.","Broedt in kolonies in hoge bomen; 'broek' van losse veren rond de poten."],"bergeend":["Wit met roestbruine borstband, groenzwarte kop en rode snavel.","Roep: man fluitend, vrouw kakelend 'ak-ak-ak'.","Grote, ganzachtige eend van het wad; broedt in konijnenholen."],"slobeend":["Man met groene kop, witte borst en roodbruine flanken; enorme lepelsnavel.","Meestal stil; man roept laag 'took took'.","Zwemt met de snavel door het water om te zeven."],"kemphaan":["Man in het voorjaar met kleurige kraag; buiten de broedtijd schubbig bruin.","Meestal stil.","Kleine kop op een lange hals en oranje poten; mannetjes houden 'kemppartijen'."],"watersnip":["Bruin gestreept met heel lange rechte snavel.","Geluid: in de balts 'mekkeren' door trillende staartveren; roep 'kètsj'.","Vliegt zigzaggend op; bokje is kleiner met kortere snavel."],"kwartel":["Klein, rond, zandbruin hoentje met strepen op kop.","Roep: 'kwik-me-dit', vooral 's avonds uit graanvelden.","Bijna nooit te zien; het geluid verraadt hem."],"zomertortel":["Kleine duif met geschubde oranjebruine rug en zwart-wit gestreepte halsvlek.","Roep: zacht snorrend 'toerrr toerrr'.","Turkse tortel is egaal zandkleurig; zomertortel is zeldzaam geworden."],"grasmus":["Grijze kop, roestbruine vleugels en een witte keel.","Zang: kort, krassend riedeltje, vaak in een sprongvlucht.","Braamsluiper is grijzer, met donkere oorvlek en zonder roestbruin."],"fitis":["Klein olijfgroen vogeltje met gele zweem en lichte pootjes.","Zang: zacht, aflopend en melancholiek riedeltje.","Tjiftjaf lijkt erop maar zingt 'tjif tjaf' en heeft donkere poten."],"fluiter":["Groen met heldergele keel en borst en witte buik.","Zang: versnellende triller 'sip sip sipsipsirrrr' en klagend 'djuu'.","Zingt in hoog loofbos, vaak met trillende vleugels."],"tuinfluiter":["Egaal grijsbruin zonder opvallende kenmerken.","Zang: lang, kabbelend, warm fluitend gekwetter.","Juist het ontbreken van kenmerken is het kenmerk; zwartkop heeft een petje."],"braamsluiper":["Grijze kop met donkere oorvlek en witte keel.","Zang: kort, droog geratel 'tetetetetet', vooraf zacht gekwetter.","Zit verborgen in dichte struiken; kleiner dan de grasmus."],"zanglijster":["Bruine rug, lichte borst met donkere pijlvormige stippen.","Zang: luid, met elke strofe twee of drie keer herhaald.","Kleiner en warmer bruin dan de grote lijster."],"grotelijster":["Groot, grijsbruin met ronde zwarte stippen op de borst.","Zang: merelachtig maar korter en weemoediger; roep ratelend.","Witte okselveren in de vlucht; groter en grijzer dan de zanglijster."],"goudhaan":["Kleinste vogel van Europa; olijfgroen met geel-oranje kruinstreep.","Zang: heel hoog 'sie-sie-sie' met slotkrul.","Zit in naaldbomen; vuurgoudhaan heeft een witte wenkbrauw."],"vuurgoudhaan":["Klein en groen met oranje kruin, witte wenkbrauw en zwarte oogstreep.","Zang: hoog, versnellend 'sie-sie-sisisi'.","Goudhaan mist de witte wenkbrauw en zwarte oogstreep."],"glanskop":["Bruingrijs met glanzend zwart petje en klein zwart befje.","Roep: niezend 'pitsjoe'.","Matkop lijkt sterk; die heeft een mat petje en een lichte vleugelvlek."],"matkop":["Bruingrijs met mat zwart petje en lichte vlek op de vleugel.","Roep: schor, hees 'tsie-tsie-dèè-dèè'.","Glanskop heeft een glanzend petje en roept 'pitsjoe'."],"kuifmees":["Grijsbruin met zwart-witte puntkuif en zwarte kraag.","Roep: rollend 'zie-zie-gurrrr'.","Komt vooral voor in naaldbossen."],"zwartemees":["Klein met zwarte kop, witte wangen en een witte nekvlek.","Zang: snel 'sietuu-sietuu', hoger dan de koolmees.","Geen gele buik; leeft vooral in naaldbomen."],"groenespecht":["Groene specht met rode kruin en gele stuit.","Roep: luid lachend 'kluu-kluu-kluu' (de 'lachende specht').","Zoekt vaak op de grond naar mieren; vliegt in golven."],"zwartespecht":["Grote, helemaal zwarte specht met rode kruin.","Roep: klagend 'kliieeh' en in de vlucht 'krie-krie-krie'.","Zo groot als een kraai; maakt grote ovale gaten in bomen."],"kleinebontespecht":["Musgroot zwart-wit spechtje met gestreepte rug; man met rode kruin.","Roep: hoog 'kie-kie-kie'; roffelt zacht en lang.","Geen witte schoudervlekken zoals de grote bonte specht."],"middelstebontespecht":["Zwart-wit met helemaal rode kruin en gestreepte flanken.","Roep: zeurend 'kwèh-kwèh'; roffelt zelden.","Grote bonte specht heeft een zwarte kruin (man alleen rood in de nek)."],"havik":["Grote, forse roofvogel met grijze rug, gestreepte borst en witte wenkbrauw.","Roep: 'kjek-kjek-kjek' bij het nest.","Sperwer is veel kleiner en slanker."],"sperwer":["Kleine roofvogel met lange staart; man met oranje gestreepte borst.","Roep: 'kie-kie-kie' bij het nest.","Jaagt verrassend op zangvogels in tuinen; korte ronde vleugels."],"wespendief":["Lijkt op een buizerd maar met een klein, duifachtig kopje en lange staart.","Roep: klagend fluitend 'pie-uu'.","Graaft wespennesten uit; zweeft met vlakke vleugels."],"bosuil":["Bruine of grijze uil met grote ronde kop en zwarte ogen.","Roep: 'hoe-hoeoeoe' (man) en 'kiewiek' (vrouw).","De bekendste nachtroep in bossen en parken."],"ransuil":["Bruin gestreepte uil met lange oorpluimen en oranje ogen.","Roep: zacht, laag 'hoe'; jongen piepen als een krakend hek.","Overwintert in groepjes in coniferen."],"houtsnip":["Bruin gemarmerd met lange snavel en dwarse strepen op de kop.","Geluid: in de baltsvlucht knorren en een scherp 'psiewiet'.","Zit perfect gecamoufleerd op de bosbodem; vliegt laat in de avond."],"koekoek":["Grijs met gestreepte buik en lange staart; lijkt op een sperwer.","Roep: 'koe-koek', overbekend.","Legt eieren in nesten van andere vogels zoals de kleine karekiet."],"appelvink":["Forse vink met enorme snavel, oranjebruine kop en zwarte bef.","Roep: scherp, kort 'tsik'.","Kraakt kersenpitten; zit vaak hoog in de boom."],"goudvink":["Man met rozerode borst, zwarte kap en grijze rug; vrouw grijsbruin.","Roep: zacht, weemoedig fluitend 'djuu'.","Witte stuit valt op in de vlucht; eet knoppen."],"putter":["Rood gezicht, wit-zwarte kop en gele vleugelband.","Zang: vrolijk, tinkelend gekwetter; roep 'stiegelitt'.","Eet zaden van distels en kaardebollen."],"sijs":["Klein, geelgroen vinkje; man met zwart petje en kinvlekje.","Zang: snel getwitter met een piepend 'dzie' aan het eind.","In de winter in groepjes in elzen en berken."],"kruisbek":["Man steenrood, vrouw groen; snavelpunten gekruist.","Roep: hard 'kip-kip-kip' in de vlucht.","Haalt zaden uit dennenappels; drinkt vaak bij plassen."],"boompieper":["Lijkt op een graspieper maar forser, met fijne strepen op de flanken.","Zang: zingt in een parachutevlucht vanuit een boom, eindigend in 'sia sia sia'.","Graspieper heeft lange achternagel en zingt in het open veld."],"roodborsttapuit":["Man met zwarte kop, witte halsvlek en oranje borst.","Roep: 'wiest trak trak', als tegen elkaar geslagen steentjes.","Zit graag bovenop struikjes in heide en duinen."],"geelgors":["Man met kanariegele kop en buik, roestbruine stuit.","Zang: 'wat-ben-je-mooi, wat-ben-je-moooooi', met langgerekte slottoon.","Zingt vanaf de top van een struik langs akkers."],"boomleeuwerik":["Bruin gestreept met witte wenkbrauwen die achter de kop samenkomen.","Zang: weemoedig, dalend 'lu-lu-lu-lu', vaak in de vlucht of 's nachts.","Korte staart; veldleeuwerik heeft witte staartranden en een kuifje."],"nachtzwaluw":["Grijsbruin, perfect boomschors-gecamoufleerd, met grote ogen.","Geluid: lang, ratelend snorren 'errrrr' in de schemering.","Man heeft witte vlekken in vleugel en staart; vliegt als een valkje."],"grauwevliegenvanger":["Grijsbruin met gestreepte kruin en borst.","Roep: dun 'tsie'; zang onopvallend.","Vliegt vanaf een zitpost op insecten en keert dan terug."],"bontevliegenvanger":["Man zwart-wit met witte vleugelvlek en witte voorhoofdsvlek.","Zang: ritmisch 'tsie-tsie-tsieuw' met heldere tonen.","Broedt in nestkasten in oude bossen; vrouw is bruin met witte vleugelvlek."],"gekraagderoodstaart":["Man met zwart gezicht, witte voorhoofdsband en oranje borst.","Zang: melancholieke inzet gevolgd door een kort, wisselend riedeltje.","Trilt met de rode staart; zwarte roodstaart is helemaal donker."],"wielewaal":["Man goudgeel met zwarte vleugels, vrouw groenig.","Zang: fluitend 'didelio', als een tropische vogel.","Hoor je veel vaker dan je hem ziet; zit hoog in populieren."],"holenduif":["Blauwgrijze duif zonder wit, met groen glanzende halsvlek en donker oog.","Roep: laag, eentonig 'hoe-oe hoe-oe'.","Kleiner dan de houtduif en zonder witte halsvlek of vleugelband."],"raaf":["Enorme zwarte kraai met forse snavel en ruige keelveren.","Roep: diep, rollend 'krok krok'.","Wigvormige staart in de vlucht; maakt luchtacrobatiek."],"kleinekarekiet":["Egaal warmbruin rietzangertje zonder strepen of wenkbrauw.","Zang: ritmisch, keuvelend 'tiri-tiri-tjerr-tjerr', elke frase twee keer.","Rietzanger heeft een duidelijke witte wenkbrauw; grote karekiet is veel groter en luider."],"rietzanger":["Bruin gestreepte rug met een opvallende crèmewitte wenkbrauw.","Zang: snel, gejaagd en afwisselend gekras met trillers.","Zingt vaak in een kort sprongvluchtje boven het riet."],"bosrietzanger":["Egaal olijfbruin, lijkt sterk op kleine karekiet.","Zang: virtuoos, imiteert tientallen andere vogels in rap tempo.","Beste herkenning is de zang; zit in ruigte en brandnetels."],"grotekarekiet":["Groot, bruin rietzangertje met forse snavel en lichte wenkbrauw.","Zang: luid en kikkerachtig 'karre-karre-kiet-kiet'.","Zo groot als een zanglijster; zeldzaam in brede rietkragen."],"sprinkhaanzanger":["Klein, olijfbruin en fijn gestreept.","Zang: minutenlang, hoog snorrend 'srrrrrrr', als een sprinkhaan.","Snor maakt een lager, zoemender snorgeluid."],"snor":["Egaal warmbruin, lijkt op kleine karekiet maar met afgeronde staart.","Zang: laag, zoemend snorren, lager dan de sprinkhaanzanger.","Zingt vaak vanaf een rietstengel in grote moerassen."],"cettiszanger":["Donker roodbruin met grijze borst en afgeronde staart.","Zang: plotseling, explosief 'tjet! tjetjetje-tjetjetje'.","Laat zich zelden zien; het luide geluid verraadt hem."],"baardman":["Kaneelbruin met lange staart; man met grijze kop en zwarte 'snor'.","Roep: metalig 'pting pting', als kleine belletjes.","Trekt in groepjes door het riet; eet rietzaad."],"blauwborst":["Man met felblauwe keel en een witte of rode vlek erin.","Zang: gevarieerd, met tinkelende en imiterende tonen.","Roestrode staartbasis valt op als hij wegvliegt."],"rietgors":["Man met zwarte kop en keel en witte 'snor' en halsband.","Zang: kort, stotterend 'tsja tsja tsjie-tsirrr'.","Vrouw is bruin gestreept met donkere baardstreep."],"waterral":["Leiblauwe buik, bruine rug met strepen en lange rode snavel.","Roep: gillend, varkensachtig gekrijs uit het riet.","Zelden te zien; loopt verscholen tussen riet en kroos."],"porseleinhoen":["Klein, bruin hoentje met witte stippen en gele snavel met rode basis.","Roep: herhaald 'kwiet', als een zweepslag, 's nachts.","Zeer verborgen; vooral te horen in natte graslanden."],"roerdomp":["Goudbruine reiger met donkere strepen, perfect gecamoufleerd.","Roep: diep 'oemp' als blazen over een fles, kilometers ver hoorbaar.","Staat met snavel omhoog stil tussen het riet."],"woudaap":["Kleinste reiger; man zwart-crème met grote lichte vleugelvlek.","Roep: laag, blaffend 'woe' herhaald.","Klimt behendig in riet; zelden gezien."],"purperreiger":["Slanke reiger met roodbruine hals en donkere strepen.","Roep: schor 'kraak', lijkt op blauwe reiger.","Donkerder en slanker dan blauwe reiger; leeft in grote rietmoerassen."],"kleinezilverreiger":["Kleine witte reiger met zwarte snavel, zwarte poten en gele tenen.","Roep: schor 'aark'.","Grote zilverreiger is veel groter met gele snavel."],"kwak":["Gedrongen reiger met zwarte kap en rug, grijze vleugels en rood oog.","Roep: kort 'kwak' in de schemering.","Vooral actief 's avonds en 's nachts; jongen bruin gespikkeld."],"lepelaar":["Grote witte vogel met lange, spatelvormige snavel.","Bijna stil.","Zwaait de snavel heen en weer door ondiep water; vliegt met gestrekte hals."],"bruinekiekendief":["Man met grijze vleugels en zwarte punten, vrouw donkerbruin met crèmekop.","Roep: miauwend 'kwie-uh' in de balts.","Vliegt laag over riet met vleugels in V."],"zeearend":["Enorme bruine arend met witte, wigvormige staart en gele snavel.","Roep: blaffend 'kli-kli-kli'.","Vleugels als een plank; broedt in grote moerasgebieden."],"visarend":["Bruine rug, witte buik en een donkere oogstreep.","Roep: klagend fluitend 'pjiep pjiep'.","Stort zich met de poten vooruit in het water om vis te vangen."],"zwartestern":["Zomer: zwarte kop en buik, grijze vleugels.","Roep: kort 'kjik' of 'kie'.","Pikt insecten van het wateroppervlak; broedt op drijvende nestvlotjes."],"ijsvogel":["Felblauw en oranje, met lange snavel.","Roep: scherp, hoog 'tiiet', vaak in de vlucht.","Schiet als een blauwe flits laag over het water."],"oeverzwaluw":["Bruine rug, witte buik met bruine borstband.","Roep: droog, schurend 'trrr'.","Broedt in kolonies in steile zandwanden."],"geoordefuut":["Zomer: zwarte kop met gouden oorpluimen en rood oog.","Roep: zacht fluitend 'poo-iieh'.","Kleiner dan de fuut; opgewipte snavel."],"wintertaling":["Kleinste eend; man met roodbruine kop en groene oogvlek.","Roep: man fluit helder 'krik krik'.","Gele driehoek bij de staart van de man."],"zomertaling":["Man met bruine kop en brede witte wenkbrauw.","Roep: man ratelend 'krrrrt'.","Alleen in de zomer; lichtblauwe voorvleugel in de vlucht."],"krooneend":["Man met oranje 'pruik', rode snavel en zwarte borst.","Meestal stil.","Vrouw bruin met lichte wangen; z n.","Meestal stil.","Achtervolgt sterns acrobatisch."],"zeekoet":["Bruinzwart en wit, met puntige snavel.","Roep: grommend 'aarr'.","Alk heeft een dikke platte snavel met witte streep."],"alk":["Zwart-wit met dikke, platte snavel met witte lijn.","Roep: laag gegrom.","Zeekoet heeft een dunne puntige snavel."],"slechtvalk":["Forse valk met blauwgrijze rug en zwarte 'snor'.","Roep: schel 'kek-kek-kek'.","Snelste vogel ter wereld in duikvlucht; broedt op hoge gebouwen."],"tapuit":["Man grijs met zwart masker; witte stuit en zwarte T op de staart.","Roep: 'tsjak tsjak'.","Zit rechtop op stenen in open terrein."],"oeverpieper":["Donkere, grijzige pieper met donkere poten.","Roep: 'fiest'.","Leeft op dijken en kwelders, vooral in de winter."],"strandleeuwerik":["Geel gezicht met zwart masker en zwarte 'hoorntjes'.","Roep: hoog 'tsie-tsie'.","Wintergast op kale stranden."],"sneeuwgors":["Veel wit in vleugels; winter met warmbruine tekening.","Roep: rollend 'tirrr' en 'pjuu'.","In de winter in groepjes langs de kust; lijkt op dwarrelende sneeuw."],"frater":["Bruin gestreept vinkje met gele snavel in de winter.","Roep: nasaal 'tsjwie-tsjwie'.","Lijkt op een kneu maar mist rood en heeft roze stuit (man)."],"kolgans":["Grijsbruine gans met witte bles en zwarte dwarsbanden op de buik.","Roep: hoog, lachend 'kowlyow'.","Komt in de winter in grote groepen uit Siberië."],"brandgans":["Klein met wit gezicht, zwarte hals en borst en grijze rug.","Roep: blaffend 'kaw', als een keffend hondje.","Canadese gans is groter met bruin lijf."],"toendrarietgans":["Donkere gans met donkere kop, oranje poten en oranje band op de snavel.","Roep: laag 'gang-gang'.","Kleine rietgans heeft roze poten en roze snavelband."],"kleinerietgans":["Compacte gans met donkere kop, roze poten en roze snavelband.","Roep: hoog 'wink-wink'.","Overwintert vooral in Friesland en Zeeland."],"rotgans":["Kleine donkere gans met zwarte kop en hals en een wit halsvlekje.","Roep: rollend 'rrot rrot'.","Eet zeegras en gras langs de waddenkust."],"kleinezwaan":["Kleinere zwaan met gele snavelbasis die niet tot een punt doorloopt.","Roep: zacht, melodieus 'hoe-hoe'.","Wilde zwaan heeft een grote, wigvormige gele vlek."],"wildezwaan":["Grote zwaan met wigvormige gele vlek op de snavel.","Roep: trompetterend 'hoep-hoep'.","Hals recht omhoog; knobbelzwaan heeft een oranje snavel."],"smient":["Man met roestbruine kop, gele bles en roze borst.","Roep: man fluit 'wie-ooo'.","Graast in grote groepen op weilanden in de winter."],"pijlstaart":["Man met chocoladebruine kop, witte halsstreep en lange puntstaart.","Roep: zacht fluitend.","Elegante, lange eend met lange hals."],"grotezaagbek":["Man wit met groenzwarte kop en rode snavel.","Meestal stil.","Vrouw heeft roestbruine kop met scherpe grens naar witte keel."],"nonnetje":["Man spierwit met zwarte 'barstjes' en zwart oogmasker.","Meestal stil.","Vrouw grijs met roodbruin kopje en witte wangen."],"topper":["Man met groenzwarte kop, lichtgrijze rug en wit lijf.","Meestal stil.","Kuifeend heeft een zwarte rug en kuifje."],"kramsvogel":["Grijze kop en stuit, kastanjebruine rug, gevlekte borst.","Roep: schor 'tsjak-tsjak-tsjak'.","Wintergast in groepen in bessenstruiken."],"koperwiek":["Lijkt op zanglijster met opvallende witte wenkbrauw en roestrode flanken.","Roep: dun 'tsiep', 's nachts tijdens de trek.","Wintergast in groepjes."],"keep":["Oranje borst en schouders, witte stuit; man in zomer met zwarte kop.","Roep: nasaal 'tsjwèèk'.","Wintergast, vaak met vinken onder beuken."],"grotebarmsijs":["Gestreept vinkje met rood voorhoofd en zwart kinvlekje; lichter dan kleine barmsijs.","Roep: 'tjet-tjet-tjet'.","Wintergast; zoekt zaden in berken en elzen."],"kleinebarmsijs":["Bruiner dan de grote barmsijs, met rood kapje en zwarte kin.","Roep: droog 'tjet-tjet'.","Broedt soms in de duinen; acrobatisch in berken."],"pestvogel":["Roze-bruin met kuif, zwart masker en gele staartpunt.","Roep: zilverig, trillend 'sirrrr'.","Invasiewintergast die besse const store = {

}

// Sessie
let session = null;
// Langere rondes: herhalingen, tot 4 nieuwe soorten, aangevuld tot 15 vragen
const qMode = s => modesOf(s).length > 1 && Math.random() < .5 ? "geluid" : "foto";
function buildQueue(level) {
  const ROUND = 15, q = [], nq = () => q.filter(x => x.type === "q").length;
  const pool = level ? SPECIES.filter(s => s.level === level) : SPECIES.filter(s => isOpen(s.level));
  if (!level) dueCards().slice(0, 10).forEach(k => { const [id, mode] = k.split(":"); if (byId[id] && isOpen(byId[id].level)) q.push({ type: "q", id, mode }); });
  if (level) dueCards().forEach(k => { const [id, mode] = k.split(":"); if (byId[id] && byId[id].level === level && nq() < 8) q.push({ type: "q", id, mode }); });
  const fresh = pool.filter(s => !isSeen(s.id)).slice(0, pool.filter(s => isSeen(s.id)).length < 8 ? 7 : 4);
  fresh.forEach(s => { q.push({ type: "intro", id: s.id }); modesOf(s).forEach(m => q.push({ type: "q", id: s.id, mode: m })); });
  const used = new Set(q.map(x => x.id));
  let fill = shuffle(pool.filter(s => isSeen(s.id) && !used.has(s.id)));
  if (nq() + fill.length < ROUND) fill = fill.concat(shuffle(SPECIES.filter(s => isSeen(s.id) && !used.has(s.id) && !fill.includes(s))));
  for (const s of fill) { if (nq() >= ROUND) break; q.push({ type: "q", id: s.id, mode: qMode(s) }); }
  const intros = q.filter(x => x.type === "intro"), qs = shuffle(q.filter(x => x.type === "q"));
  return [...intros, ...qs];
}
function startSession(level) {
  session = { queue: buildQueue(level), i: 0, right: 0, total: 0, streak: 0, retried: new Set(), level, round: 1, r0: 0, t0: 0 };
  [...new Set(session.queue.map(x => x.id))].forEach(id => getMedia(byId[id]).catch(() => {}));
  if (location.hash === "#quiz") route(); else location.hash = "#quiz";
}
// Na een ronde ga je meteen door met de volgende; stoppen doe je zelf
function nextRound() {
  markDay();
  const r = session.right - session.r0, t = session.total - session.t0;
  session.r0 = session.right; session.t0 = session.total; session.round++;
  session.queue = buildQueue(session.level); session.i = 0; session.retried = new Set();
  [...new Set(session.queue.map(x => x.id))].forEach(id => getMedia(byId[id]).catch(() => {}));
  toast(`Ronde ${session.round - 1} klaar: ${r} van ${t} goed. Door met ronde ${session.round}!`);
}
app.addEventListener("click", e => {
  const b = e.target.closest("#qsnd"); if (!b) return;
  soundOn = !soundOn; store.set("vw:sound:v2", soundOn);
  const fb = document.getElementById("fb");
  if (fb && fb.innerHTML.trim()) { b.outerHTML = qsndHtml(); return; }
  stopAudio(); viewQuiz();
});
const qsndHtml = () => `<button class="qsnd" id="qsnd" aria-pressed="${soundOn}" aria-label="${soundOn ? "Geluid staat aan, tik voor alleen foto's" : "Alleen foto's, tik om geluid aan te zetten"}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/>${soundOn ? '<path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/>' : '<path d="M15.5 9.5l5 5M20.5 9.5l-5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>'}</svg>${soundOn ? "Aan" : "Uit"}</button>`;
function distractors(s) {
  const pool = SPECIES.filter(x => x.id !== s.id && (isOpen(x.level) || x.level === s.level));
  const same = shuffle(pool.filter(x => x.level === s.level)), other = shuffle(pool.filter(x => x.level !== s.level));
  return [...same, ...other].slice(0, 3);
}

async function viewQuiz() {
  setNav("home");
  if (!session) return viewDone();
  if (session.i >= session.queue.length) { if (!session.total) return viewDone(); nextRound(); if (!session.queue.length) return viewDone(); }
  const item = session.queue[session.i], s = byId[item.id];
  const head = `<div class="qtop"><a href="#klaar">Stoppen</a><div class="segs" aria-hidden="true"><b style="width:${Math.round(session.i / session.queue.length * 100)}%"></b></div><span>${session.i + 1}/${session.queue.length}</span><span class="streak">${session.streak >= 2 ? `${session.streak} op rij` : ""}</span>${qsndHtml()}</div>`;
  app.innerHTML = `<section class="panel" style="--lv:${lvColor(s.level)}">${head}<p class="small">Foto's en geluiden laden…</p></section>`;
  let m;
  try { m = await getMedia(s); }
  catch { app.innerHTML = `<section class="notice">Kan de foto's en geluiden niet laden. Probeer het opnieuw.<div style="margin-top:10px"><button id="retry">Opnieuw proberen</button></div></section>`; document.getElementById("retry").onclick = viewQuiz; return; }

  if (item.type === "intro") {
    const ph = m.photos[0], so = m.sounds[0], introPh = m.photos.filter(p => !p.placeholder).length ? m.photos.filter(p => !p.placeholder) : m.photos;
    app.innerHTML = `<section class="panel" style="--lv:${lvColor(s.level)}">${head}
      <div class="intro-name"><span class="label">Nieuwe soort · niveau ${s.level}</span><h1>${s.nl}</h1><i>${s.sci}</i></div>
      ${ph ? swipeHtml(introPh, s.nl) : `<p class="small">Geen foto gevonden.</p>`}
      ${!soundOn ? "" : so ? playerHtml(so.src) : `<p class="small">Nog geen geluid voor deze soort.</p>`}
      <div class="feedback"><strong>Zo herken je hem</strong><ul>${s.tips.map(t => `<li>${t}</li>`).join("")}</ul><span class="small">Leefgebied: ${s.habitat}</span></div>
      <div><button class="primary big" id="next">Verder</button></div></section>`;
    wirePlayers(app); wireSwipe(app, introPh);
    document.getElementById("next").onclick = () => { stopAudio(); session.i++; viewQuiz(); };
    return;
  }

  let mode = soundOn ? item.mode : "foto";
  if (mode === "geluid" && !m.sounds.length) mode = "foto";
  if (mode === "foto" && !m.photos.length) mode = m.sounds.length ? "geluid" : null;
  if (!mode) { session.i++; return viewQuiz(); }
  const realPh = m.photos.filter(p => !p.placeholder), quizPh = shuffle(realPh.length ? realPh : m.photos), asset = mode === "foto" ? quizPh[0] : pick(m.sounds);
  const opts = shuffle([s, ...distractors(s)]), openQ = ((progress[cardKey(s.id, mode)] || {}).box || 0) >= 2;
  app.innerHTML = `<section class="panel" style="--lv:${lvColor(s.level)}">${head}
    <div class="question">${mode === "foto" ? "Wie is dit?" : "Wie hoor je?"}</div>
    ${mode === "foto"
      ? `${swipeHtml(quizPh, "Welke vogel is dit?", false)}<p class="figcap"><span class="mono">Afb. ${session.i + 1}</span><span>${quizPh.length > 1 ? `Veeg voor ${quizPh.length} foto's` : asset.placeholder ? "Tekening" : "Foto"}</span></p>`
      : playerHtml(asset.src, true)}
    ${openQ ? openHtml() : `<div class="options">${opts.map((o, i) => `<button data-id="${o.id}"><kbd>${"abcd"[i]}</kbd>${o.nl}<span class="opt-latin">${o.sci}</span></button>`).join("")}</div>`}
    <div id="fb"></div></section>`;
  wirePlayers(app); if (mode === "foto") wireSwipe(app, quizPh);
  const answer = (btn, pickedId) => {
    const ok = pickedId === s.id;
    app.querySelectorAll(".options button").forEach(b => { b.disabled = true; if (b.dataset.id === s.id) b.classList.add("right"); });
    if (!ok && btn.tagName === "BUTTON") btn.classList.add("wrong");
    const prevUnl = unlockedLevel(), prevBox = (progress[cardKey(s.id, mode)] || {}).box || 0;
    grade(s.id, mode, ok);
    session.total++; if (ok) { session.right++; session.streak++; addXp(10 + Math.min(session.streak, 5) * 2, btn); } else session.streak = 0;
    const st = document.querySelector(".streak"); if (st) { st.textContent = session.streak >= 2 ? `${session.streak} op rij` : ""; if (session.streak >= 2) { st.classList.remove("bump"); void st.offsetWidth; st.classList.add("bump"); } }
    if (ok && prevBox < 2 && progress[cardKey(s.id, mode)].box >= 2) toast(`${s.nl} ${mode === "foto" ? "op zicht" : "op geluid"}: gekend!`);
    const nowUnl = unlockedLevel(); if (nowUnl > prevUnl) session.levelUp = nowUnl;
    if (!ok && !session.retried.has(cardKey(s.id, mode))) { session.retried.add(cardKey(s.id, mode)); session.queue.splice(Math.min(session.i + 4, session.queue.length), 0, { type: "q", id: s.id, mode }); }
    const chosen = byId[pickedId];
    document.getElementById("fb").innerHTML = `<div class="feedback ${ok ? "" : "bad"}">
      <strong>${ok ? `Juist, een ${s.nl.toLowerCase()}.` : `Nee, dit is een ${s.nl.toLowerCase()}.`}</strong>
      ${!ok && chosen && LOOK[chosen.id] ? `<span class="small">De ${chosen.nl.toLowerCase()} herken je zo: ${chosen.tips[0].charAt(0).toLowerCase() + chosen.tips[0].slice(1)}</span>` : ""}
      <ul>${s.tips.map(t => `<li>${t}</li>`).join("")}</ul></div>
      ${credit(asset)}
      <div style="margin-top:14px"><button class="primary big" id="next">Volgende</button></div>`;
    const nx = document.getElementById("next"); nx.focus();
    nx.onclick = () => { stopAudio(); if (session.levelUp) { const n = session.levelUp; session.levelUp = 0; celebrate(n, () => { session.i++; viewQuiz(); }); } else { session.i++; viewQuiz(); } };
  };
  app.querySelectorAll(".options button").forEach(btn => btn.onclick = () => answer(btn, btn.dataset.id));
  wireOpen(answer, s);
}
// Open vragen: zodra een kaart gekend is (vak 2+), typ je de naam zelf. Kleine tikfouten mogen.
const normName = t => String(t).toLowerCase().normalize("NFD").replace(/[^a-z]/g, "");
function lev(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; }
  }
  return d[b.length];
}
function matchName(input) {
  const n = normName(input); if (!n) return null;
  let best = null, bd = 99;
  for (const x of SPECIES) for (const name of [x.nl, x.sci]) { const d = lev(n, normName(name)); if (d < bd) { bd = d; best = x; } }
  const tol = Math.max(1, Math.floor(normName(best.nl).length / 6));
  return bd <= tol ? { s: best, exact: bd === 0 } : null;
}
const openHtml = () => `<form class="openq" id="openf" autocomplete="off">
  <label for="oa" class="label">Open vraag · typ de naam</label>
  <div class="openrow"><input id="oa" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Bijv. merel"><button class="primary" type="submit">Check</button></div>
  <button type="button" class="dunno" id="dunno">Weet ik niet</button>
</form>`;
function wireOpen(answer, s) {
  const f = document.getElementById("openf"); if (!f) return;
  const inp = f.querySelector("input");
  const done = (pickedId, note) => {
    f.querySelectorAll("input,button").forEach(x => x.disabled = true);
    inp.classList.add(pickedId === s.id ? "right" : "wrong");
    answer(inp, pickedId);
    if (note) { const fb = document.querySelector("#fb .feedback"); if (fb) fb.insertAdjacentHTML("afterbegin", `<span class="small">${note}</span>`); }
  };
  f.onsubmit = e => {
    e.preventDefault();
    const v = inp.value.trim(); if (!v) { inp.focus(); return; }
    const m = matchName(v);
    if (m && m.s.id === s.id) done(s.id, m.exact ? "" : `Goed gerekend. Zo schrijf je hem: ${s.nl}.`);
    else done(m ? m.s.id : "__none__", m ? "" : `Jij typte "${esc(v)}". Die naam ken ik niet.`);
  };
  document.getElementById("dunno").onclick = () => done("__none__", "");
}

function viewDone() {
  const r = session ? session : { right: 0, total: 0 };
  const pct = r.total ? Math.round(r.right / r.total * 100) : 0;
  if (r.total) markDay();
  app.innerHTML = `<section class="panel done"><span class="label">Ronde klaar</span>
    ${r.total ? `<div class="score">${r.right}<span>/${r.total}</span></div><h2>${pct >= 80 ? "Sterk. Je herkent ze steeds beter." : pct >= 50 ? "Goed op weg." : "Dat waren lastige. Morgen gaat het beter."}</h2>` : `<h2>Niets meer te doen voor nu</h2>`}
    <dl class="tally"><div><dt>Dagen op rij</dt><dd>${stats.days}</dd></div><div><dt>Veren</dt><dd>${stats.xp}</dd></div></dl>
    <p class="small">Wat je fout had komt over tien minuten terug. Wat je goed had zie je pas over een paar dagen weer.</p>
    <div class="row"><button class="primary big" onclick="location.hash='#home'">Naar het leerpad</button><button onclick="startSession()">Nog een ronde</button></div></section>`;
  session = null;
}

async function viewGids() {
  setNav("gids");
  app.innerHTML = LEVELS.map(l => `<section style="display:grid;gap:18px;--lv:${lvColor(l.n)}"><div class="sect-head"><span class="label">Niveau ${String(l.n).padStart(2, "0")} · ${SPECIES.filter(s => s.level === l.n).length} soorten</span><h2>${l.name}</h2></div>
    <div class="grid">${SPECIES.filter(s => s.level === l.n).map(s => `<a class="card" href="#soort-${s.id}"><div class="thumb" id="th-${s.id}"></div><div class="name"><strong>${s.nl}</strong><i>${s.sci}</i></div></a>`).join("")}</div></section>`).join("");
  for (const s of SPECIES) {
    const el = document.getElementById("th-" + s.id); if (el) el.innerHTML = photoOf(s) ? `<img src="${photoOf(s)}" alt="" loading="lazy">` : `<span class="ava big">${s.nl.replace(/[^A-Za-zÀ-ÿ]/g, "").slice(0, 2)}</span>`;
  }
}
async function viewSoort(id) {
  setNav("gids");
  const s = byId[id]; if (!s) return viewGids();
  app.style.setProperty("--lv", lvColor(s.level));
  const p = progress;
  const stat = m => { const c = p[cardKey(id, m)]; return c ? `${c.right} goed, ${c.wrong} fout` : "nog niet geoefend"; };
  app.innerHTML = `<section class="panel"><a href="#gids" class="small">← Soortengids</a>
    <h1 style="font-size:clamp(2.6rem,12vw,4.5rem)">${s.nl}</h1><p><i>${s.sci}</i> · Niveau ${s.level}: ${LEVELS[s.level - 1].name}</p>
    <div class="feedback"><strong>Kenmerken</strong><ul>${s.tips.map(t => `<li>${t}</li>`).join("")}</ul><span class="small">Leefgebied: ${s.habitat}</span></div>
    <p class="small">Jouw score. Zicht: ${stat("foto")}. Geluid: ${stat("geluid")}.</p></section>
    <section class="panel"><h2>Foto's</h2><div id="ph" class="small">Laden…</div></section>
    <section class="panel"><h2>Geluiden</h2><div id="so" class="small">Laden…</div></section>`;
  try {
    const m = await getMedia(s);
    document.getElementById("ph").outerHTML = m.photos.length ? `<div id="phs">${swipeHtml(m.photos, s.nl)}</div>` : `<p class="small">Geen foto's gevonden.</p>`;
    if (m.photos.length) wireSwipe(document.getElementById("phs"), m.photos);
    document.getElementById("so").outerHTML = m.sounds.length ? `<div class="sounds">${m.sounds.map(so => `<div>${playerHtml(so.src)}${credit(so)}</div>`).join("")}</div>` : `<p class="small">Nog geen geluid voor deze soort.</p>`;
    wirePlayers(app);
  } catch {
    document.getElementById("ph").textContent = "Kan de foto's niet laden.";
    document.getElementById("so").textContent = "";
  }
}
function viewOver() {
  setNav("over");
  app.innerHTML = `<section class="panel"><h1>Over Vogelwijs</h1>
    <p>Een gratis site met ${SPECIES.length} algemene Nederlandse soorten in ${LEVELS.length} niveaus.</p>
    <p>Foto's en geluiden komen van iNaturalist, gemaakt door vrijwilligers en gedeeld onder een Creative Commons-licentie. Bij elke foto en opname staat wie hem maakte.</p>
    <p>Bijna elke soort heeft een echte opname: steeds de duidelijkste vijf seconden. Een paar stille soorten oefen je alleen op foto's.</p>
    <p>Je voortgang wordt alleen in deze browser bewaard.</p>
    <div><button id="reset">Voortgang wissen</button> <span id="resetmsg" class="small"></span></div></section>`;
  let armed = false;
  document.getElementById("reset").onclick = e => {
    if (!armed) { armed = true; e.target.textContent = "Klik nogmaals om te wissen"; return; }
    progress = {}; saveProgress(); manualOpen = []; store.set("vw:open:v1", []); e.target.textContent = "Voortgang wissen"; armed = false; document.getElementById("resetmsg").textContent = "Gewist.";
  };
}

function route() {
  app.style.removeProperty("--lv");
  const h = location.hash.slice(1) || "home";
  window.scrollTo(0, 0);
  if (h === "quiz") return viewQuiz();
  if (h === "klaar") return viewDone();
  if (h === "gids") return viewGids();
  if (h === "over") return viewOver();
  if (h.startsWith("soort-")) return viewSoort(h.slice(6));
  return viewHome();
}
window.addEventListener("hashchange", route);
route();
</script>
